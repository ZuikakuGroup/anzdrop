name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

# 公開リポジトリのビルド成果物に GitHub Artifact Attestation を付ける。
permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Type check router Worker
        run: npm run check:router

      - name: Type check public Astro pages
        run: npm run check:public

      - name: Test
        run: npx vitest run

      - name: Build and archive deployable Workers
        run: bash scripts/prepare-auditable-deployment.sh
        env:
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}

      - name: Attest deployment archive
        uses: actions/attest@v4
        with:
          subject-path: tmp/anzdrop-deploy.tar

      - name: Save deployment archive
        uses: actions/upload-artifact@v7
        with:
          name: deployment-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/anzdrop-deploy.tar
            tmp/anzdrop-deploy.tar.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy attested Workers and identify deployments
        run: node scripts/deploy-audited.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Save successful deployment manifest
        uses: actions/upload-artifact@v7
        with:
          name: deployment-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/deployment-manifest.json
          if-no-files-found: error
          retention-days: 90
