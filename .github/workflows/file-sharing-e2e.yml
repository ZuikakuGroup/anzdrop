name: File sharing E2E

on:
  pull_request:
  merge_group:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      size_mib:
        description: 'Optional Chromium size test in MiB (0 skips large files)'
        type: choice
        default: '0'
        options: ['0', '1', '10', '100', '1024']

permissions:
  contents: read

concurrency:
  group: sharing-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  sharing:
    name: Sharing (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 40 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_PROJECT: ${{ matrix.browser }}
      E2E_WORKERS: '1'
      E2E_TEST_FILES: tests/e2e/file-sharing.spec.ts
      E2E_EXTENDED: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      E2E_RESILIENCE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run isolated sharing tests
        shell: bash
        env:
          REQUESTED_SIZE: ${{ matrix.browser == 'chromium' && inputs.size_mib || '0' }}
        run: |
          if [ "$REQUESTED_SIZE" != '0' ]; then export E2E_LARGE_MIB="$REQUESTED_SIZE"; fi
          npm run test:sharing
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sharing-${{ matrix.browser }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
