name: Weekly Development Report

on:
  schedule:
    # 毎週月曜 00:15 UTC
    - cron: "15 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # 週次集計で Actions runs / open PRs を読むため
  actions: read
  pull-requests: read

concurrency:
  group: weekly-report
  cancel-in-progress: false

jobs:
  report:
    name: Generate weekly report issue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Generate or update weekly report Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/weekly-report.mjs

      - name: Upload report markdown
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: weekly-report-${{ github.run_id }}
          path: weekly-report.md
          if-no-files-found: warn
          retention-days: 30
