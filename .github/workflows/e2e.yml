name: E2E (post-deploy)

# 本番は Cloudflare Pages ではなく Workers。
# main への push で動く Deploy workflow 成功後に、公開 URL へ向けて Playwright を実行する。
# 二重デプロイはしない(既存 deploy.yml の完了を待つだけ)。
on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: "E2E target base URL"
        required: false
        default: "https://anzdrop.com"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

env:
  E2E_BASE_URL: ${{ github.event.inputs.base_url || 'https://anzdrop.com' }}

jobs:
  e2e:
    name: Playwright against production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # workflow_run はデフォルトブランチ文脈で動く。ここでは信頼済みの
      # デフォルトブランチ(テストコード)を checkout し、検証対象は本番 URL とする。
      # workflow_run.head_sha を privilege 付きで checkout すると、CodeQL の
      # cache poisoning 警告(actions/cache-poisoning)の対象になるため避ける。
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Wait for deployed URL
        run: bash scripts/wait-for-url.sh "$E2E_BASE_URL/" 180 5

      - name: Run Playwright
        run: npx playwright test
        env:
          CI: "true"
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}

      - name: Upload Playwright report (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
