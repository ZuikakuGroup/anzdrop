name: E2E (post-deploy)

# Remote production checks are read-only. Synthetic sharing runs only on staging/local.
on:
  workflow_run:
    workflows: ["Deploy to Cloudflare Workers"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Read-only production smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify production without creating files/accounts
        run: node scripts/release-smoke.mjs
        env:
          SMOKE_ORIGIN: https://anzdrop.com
          EXPECTED_ORIGIN: https://anzdrop.com
