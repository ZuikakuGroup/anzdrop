name: CI

on:
  pull_request:
  merge_group:

# mainへのpushはdeploy.ymlが同じチェックを行うため、ここではpull_requestのみで
# トリガーする(以前はpushにも反応していたが、PRを開いた直後はpushイベントと
# pull_requestイベントが同じコミットに対して両方発火し、後発のイベントが前の
# 実行をキャンセルすることでPRのチェック一覧に紛らわしい失敗表示が残っていた)。
# 同一PRへの連続pushでの二重実行を避けるため、concurrencyは維持する。
# merge_groupはMerge Queueが作る一時ブランチに対するイベントで、これが無いと
# 必須ステータスチェックがそのブランチ上で永久に報告されずキューが進まない。

# このワークフローはソース取得と lint/型チェック/テストのみで、GITHUB_TOKEN による
# 書き込みは行わない。既定の権限に依存せず最小権限にする(deploy.yml と揃える)。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run check -- lint

      - name: Type check
        run: npm run check -- types

      - name: Type check router Worker
        run: npm run check -- router

      - name: Type check public Astro pages
        run: npm run check -- public

      - name: Test
        run: npm run check -- test

  public-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify Astro pages on Workers
        run: npm run test:astro-hono
        env:
          # Sharing is covered by the dedicated three-browser workflow.
          E2E_TEST_FILES: tests/e2e/public-astro.spec.ts tests/e2e/account-security.spec.ts tests/e2e/smoke.spec.ts tests/e2e/astro-hono.spec.ts tests/e2e/support-admin-astro.spec.ts
      - name: Verify authorized admin Astro pages on Workers
        run: npm run test:astro-hono
        env:
          E2E_LOCAL_ADMIN_BYPASS: "true"
          E2E_TEST_FILES: tests/e2e/support-admin-astro.spec.ts
