name: CI

on:
  pull_request:
  merge_group:

# mainへのpushはdeploy.ymlが同じチェックを行うため、ここではpull_requestのみで
# トリガーする(以前はpushにも反応していたが、PRを開いた直後はpushイベントと
# pull_requestイベントが同じコミットに対して両方発火し、後発のイベントが前の
# 実行をキャンセルすることでPRのチェック一覧に紛らわしい失敗表示が残っていた)。
# 同一PRへの連続pushでの二重実行を避けるため、concurrencyは維持する。
# merge_groupはMerge Queueが作る一時ブランチに対するイベントで、これが無いと
# 必須ステータスチェックがそのブランチ上で永久に報告されずキューが進まない。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run
